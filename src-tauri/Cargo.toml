[package]
name = "inkwell"
version = "0.1.0"
description = "Inkwell desktop Markdown editor"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
spellbook = "0.4.2"
