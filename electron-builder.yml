appId: io.inkwell.app
productName: Inkwell
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/Welcome.md
    to: Welcome.md
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: mdown
    name: Markdown Document
    role: Editor
  - ext: mkd
    name: Markdown Document
    role: Editor
  - ext: inkproj
    name: Inkwell Project
    role: Editor
mac:
  category: public.app-category.productivity
  target: [dmg]
win:
  target: [nsis]
  icon: resources/icon.ico
linux:
  target: [AppImage]
  category: Utility
  icon: resources/icon.png
